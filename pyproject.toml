[project]
name = "omniagent"
version = "0.1.0"
description = "Autonomous multi-agent RAG platform: hybrid retrieval + cyclical reflection + measured evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-embeddings-huggingface>=0.8.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "openai>=1.40",
    "tenacity>=8.4",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires Postgres/Ollama backend"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
